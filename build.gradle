plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ---------------------------------------------------------------------------
// ./gradlew test  -- all three parts through JUnit, one test per rule.
//
// The three parts are independent, so the report is printed per part. A part you
// were not asked to do simply shows as red and can be ignored.
// ---------------------------------------------------------------------------
test {
    useJUnitPlatform()

    // Part 3 measures real allocation numbers: keep the test JVM to itself.
    maxParallelForks = 1
    forkEvery = 0
    outputs.upToDateWhen { false }

    testLogging {
        // All per-test output is produced by the afterTest hook below, so that the
        // PASS/FAIL line and its assertion message stay together and read the same
        // as ./gradlew part1.
        events = []
        showStandardStreams = false
        showExceptions = false
        showCauses = false
        showStackTraces = false
    }

    // Gradle also reports failures at ERROR level, which would duplicate the lines
    // printed above. Silence every level; afterTest is the only reporter.
    org.gradle.api.logging.LogLevel.values().each { level ->
        testLogging.get(level).with {
            events = []
            showExceptions = false
            showCauses = false
            showStackTraces = false
        }
    }

    def parts = ['PART1', 'PART2', 'PART3']
    def total = [:]
    def passed = [:]
    parts.each {
        total[it] = new java.util.concurrent.atomic.AtomicInteger()
        passed[it] = new java.util.concurrent.atomic.AtomicInteger()
    }

    afterTest { desc, result ->
        String name = desc.displayName ?: desc.name
        boolean ok = result.resultType == TestResult.ResultType.SUCCESS
        def part = parts.find { name.startsWith(it) }
        if (part != null) {
            total[part].incrementAndGet()
            if (ok) passed[part].incrementAndGet()
        }
        println(ok ? "[PASS] ${name}" : "[FAIL] ${name}")
        if (!ok) {
            def ex = result.exceptions ? result.exceptions[0] : null
            String msg = ex?.message ?: ex?.toString()
            if (msg) {
                msg.readLines().each { println '       ' + it }
            }
        }
    }

    afterSuite { desc, result ->
        if (desc.parent != null) return
        int ran = parts.sum { total[it].get() }
        println ''
        println '----------------------------------------------------------------'
        parts.eachWithIndex { part, i ->
            println "PART ${i + 1}   ${passed[part].get()} / ${total[part].get()} passed"
        }
        println '----------------------------------------------------------------'
        if (ran == 0) {
            println 'NO CHECKS RAN. This is a build or test-discovery problem, not a pass.'
            println 'Check that the Part1Tests / Part2Tests / Part3Tests classes compiled and'
            println 'that their display names still start with PART1 / PART2 / PART3.'
        } else if (parts.every { passed[it].get() == total[it].get() }) {
            println 'All rules of all three parts satisfied.'
        } else {
            println 'Rules are still violated. SPEC-part1.md / SPEC-part2.md / SPEC-part3.md says what each rule requires.'
            println 'The three parts are independent: a part you were not asked to do can be'
            println 'left red.'
        }
        println ''
    }
}

// ---------------------------------------------------------------------------
// ./gradlew part1 | part2 | part3
//
// Runs one part's checks with no dependencies at all -- useful if you cannot
// reach Maven Central, or if you just want the plain console report.
//
// Each PartNChecks class lives in src/test/java but has no test-framework
// dependency, so it is compiled on its own here against main only. That keeps
// these tasks working with no network even though the JUnit route needs Maven
// Central. Each part is compiled and run separately: no part's task touches
// another part's sources.
// ---------------------------------------------------------------------------
[
        [n: 1, pkg: 'part1.fuel', file: 'src/test/java/part1/fuel/Part1Checks.java',
         what: 'core functionality: a fuel-price board'],
        [n: 2, pkg: 'part2.accounts', file: 'src/test/java/part2/accounts/Part2Checks.java',
         what: 'concurrency and diagnosis: an account service'],
        [n: 3, pkg: 'part3.etrading', file: 'src/test/java/part3/etrading/Part3Checks.java',
         what: 'allocation on a hot path: a market-data aggregator'],
].each { part ->
    def classesDir = layout.buildDirectory.dir("part${part.n}-classes")

    tasks.register("compilePart${part.n}", JavaCompile) {
        source = files(part.file)
        classpath = sourceSets.main.runtimeClasspath
        destinationDirectory = classesDir
    }

    tasks.register("part${part.n}", JavaExec) {
        group = 'verification'
        description = "Runs part ${part.n} of SPEC-part1.md / SPEC-part2.md / SPEC-part3.md (${part.what}) without JUnit."
        dependsOn "compilePart${part.n}"
        classpath = sourceSets.main.runtimeClasspath + files(classesDir)
        mainClass = "${part.pkg}.Part${part.n}Checks"
        ignoreExitValue = true
    }
}
